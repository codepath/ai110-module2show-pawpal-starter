[project]
name = "ai110-module2show-pawpal-starter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.30",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
